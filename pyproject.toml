[project]
name = "personal-pm-agent"
version = "0.1.0"
description = "Personal PM Agent monorepo root"
requires-python = ">=3.13,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13",
    "mypy>=1.18",
    "pyyaml>=6.0,<7",
]

[tool.uv.workspace]
members = ["packages/planner", "apps/api", "apps/worker"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services such as PostgreSQL or Redis",
    "e2e: end-to-end browser or system tests",
]
