scenarios:
  - scenario: normal-write
    metric_ids: [EXT-001]
  - scenario: api-timeout
    metric_ids: [EXT-003]
  - scenario: rate-limit-429
    metric_ids: [EXT-006]
  - scenario: provider-5xx
    metric_ids: [EXT-006]
  - scenario: oauth-expired
    metric_ids: [EXT-004]
  - scenario: duplicate-worker-delivery
    metric_ids: [EXT-002]
  - scenario: crash-after-db-commit
    metric_ids: [EXT-006]
  - scenario: provider-success-response-lost
    metric_ids: [EXT-007]
  - scenario: external-move-no-restore
    metric_ids: [EXT-005]
  - scenario: webhook-gap-recovery
    metric_ids: [webhook_recovery_seconds]
