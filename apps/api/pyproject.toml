[project]
name = "personal-pm-api"
version = "0.1.0"
description = "Personal PM Agent FastAPI modular monolith"
requires-python = ">=3.13,<3.14"
dependencies = [
    "personal-pm-planner",
    "fastapi>=0.141,<0.142",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.11",
    "uvicorn>=0.38",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "boto3>=1.40,<2",
    "redis>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_pm_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL via compose",
]
addopts = "-m 'not integration'"
