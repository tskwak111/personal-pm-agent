[project]
name = "personal-pm-api"
version = "0.1.0"
description = "Personal PM Agent FastAPI modular monolith"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_pm_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
