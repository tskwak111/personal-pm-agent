# One-off migration job: runs alembic upgrade head before API rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: pma-migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/personal-pm/api:latest
          command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
