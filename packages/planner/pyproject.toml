[project]
name = "personal-pm-planner"
version = "0.1.0"
description = "Pure deterministic planning engine for Personal PM Agent"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "hypothesis>=6.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_pm_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
